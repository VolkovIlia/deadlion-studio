id: dl-py-list-membership
language: Python
severity: warning
message: "Check the container type and number of probes. Linear membership across q probes costs O(q n). Hashing may cost more for small inputs or require extra memory."
rule:
  pattern: "$X in $Y"
  inside:
    any:
      - kind: for_statement
      - kind: list_comprehension
    stopBy: end
