id: dl-py-loop-serialization
language: Python
severity: warning
message: "Check mutability, encoder side effects and allocation counts before hoisting serialization."
rule:
  pattern: "json.dumps($X)"
  inside:
    kind: for_statement
    stopBy: end
  not:
    inside:
      pattern: "for $X in $ITEMS: $$$BODY"
      stopBy: end
