name: Bug report
description: A skill, tool, hook or template does something wrong
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Security problems go to SECURITY.md, not here.
  - type: dropdown
    id: plugin
    attributes:
      label: Plugin
      options:
        - deadlion
        - deadlion-triz
        - repo (tests, CI, export-skills)
    validations:
      required: true
  - type: input
    id: component
    attributes:
      label: Skill, tool or hook
      placeholder: "e.g. ux-design, dl-contrast, the dl-size hook, rust-tui template"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Paste the exact output, error or the part of Claude's reply that is wrong.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The prompt or command, and the smallest repo state that shows the bug.
      placeholder: |
        1. claude --plugin-dir ./plugins/deadlion
        2. Prompt: "..."
        3. ...
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Plugin version (from /plugin), `claude --version`, OS.
      placeholder: "deadlion 4.2.0, Claude Code 2.1.294, Fedora 44"
    validations:
      required: true
