name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: pytest
        run: pip install -r requirements-dev.txt && pytest tests -q
      - name: Structural performance rule corpus
        run: |
          npm install --global @ast-grep/cli@0.51.3
          ast-grep test --skip-snapshot-tests -c plugins/deadlion/skills/performance/ast/sgconfig.yml
      - name: OMP event adapter contracts
        run: node tests/test_performance_omp.mjs
      - name: Verify performance contracts on this checkout
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob globstar
          gate=plugins/deadlion/skills/performance/scripts/dl-perf-gate
          for contract in plugins/deadlion/evals/indexed-membership/contract.json .performance/**/contract.json; do
            "$gate" "$contract" | tee -a "$RUNNER_TEMP/performance.jsonl"
          done
      - name: Performance diagnostics
        run: plugins/deadlion/skills/performance/scripts/dl-analyze --all --deep --json
      - name: export-skills
        run: sh tests/test_export_skills.sh
      # The npm package ships the real binary as a per-platform optional
      # dependency; when its download is skipped, install.cjs places it.
      - name: claude CLI
        run: |
          npm i -g @anthropic-ai/claude-code --include=optional
          claude --version || node "$(npm root -g)/@anthropic-ai/claude-code/install.cjs"
          claude --version
      - name: claude plugin validate
        run: for p in plugins/*/; do claude plugin validate "$p" --strict; done
