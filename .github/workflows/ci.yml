name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: pytest
        run: pip install -r requirements-dev.txt && pytest tests -q
      - name: export-skills
        run: sh tests/test_export_skills.sh
      # The npm package ships the real binary as a per-platform optional
      # dependency; when its download is skipped, install.cjs places it.
      - name: claude CLI
        run: |
          npm i -g @anthropic-ai/claude-code --include=optional
          claude --version || node "$(npm root -g)/@anthropic-ai/claude-code/install.cjs"
          claude --version
      - name: claude plugin validate
        run: for p in plugins/*/; do claude plugin validate "$p" --strict; done
