name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Terminal and isolation tools
        run: sudo apt-get update && sudo apt-get install -y tmux bubblewrap dbus-user-session
      - name: pytest
        run: pip install -r requirements-dev.txt && pytest tests -q
      - name: Structural performance rule corpus
        run: |
          npm install --global @ast-grep/cli@0.51.3
          ast-grep test --skip-snapshot-tests -c plugins/deadlion/skills/performance/ast/sgconfig.yml
      - name: OMP event adapter contracts
        run: node --test tests/test_*_omp.mjs
      - name: Verify performance contracts on this checkout
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob globstar
          gate=plugins/deadlion/skills/performance/scripts/dl-perf-gate
          for contract in plugins/deadlion/evals/indexed-membership/contract.json .performance/**/contract.json; do
            "$gate" "$contract" | tee -a "$RUNNER_TEMP/performance.jsonl"
          done
      - name: Performance diagnostics
        run: plugins/deadlion/skills/performance/scripts/dl-analyze --all --deep --json
      - name: export-skills
        run: sh tests/test_export_skills.sh
      # The npm package ships the real binary as a per-platform optional
      # dependency; when its download is skipped, install.cjs places it.
      - name: claude CLI
        run: |
          npm i -g @anthropic-ai/claude-code --include=optional
          claude --version || node "$(npm root -g)/@anthropic-ai/claude-code/install.cjs"
          claude --version
      - name: claude plugin validate
        run: for p in plugins/*/; do claude plugin validate "$p" --strict; done

  live-omp:
    name: Live OMP ${{ matrix.version }} / ${{ matrix.scenario }}
    runs-on: ${{ (matrix.scenario == 'autoresearch_smoke' || matrix.scenario == 'engineering_evolution') && 'ubuntu-22.04' || 'ubuntu-26.04' }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        scenario: [engineering_smoke, engineering_evolution, autoresearch_smoke, refactoring_smoke, lsp_matrix]
        include:
          - version: 19.2.1
            sha256: e8b937f9bf023baa147bdd300ad5421af0a6ef8b1f350c47a9a93d5fca94feca
          - version: 19.2.0
            sha256: 74cb641d3fcdc22fa3f2141dafa4e66c9fc581d7d2d71753e690160980472c31
        version: [19.2.1, 19.2.0]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install live test prerequisites
        env:
          OMP_VERSION: ${{ matrix.version }}
          OMP_SHA256: ${{ matrix.sha256 }}
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/omp-bin"
          mkdir -p "$bin"
          curl --fail --location --retry 3 "https://github.com/can1357/oh-my-pi/releases/download/v$OMP_VERSION/omp-linux-x64" -o "$bin/omp"
          printf '%s  %s\n' "$OMP_SHA256" "$bin/omp" | sha256sum -c -
          chmod +x "$bin/omp"
          test "$("$bin/omp" --version)" = "omp/$OMP_VERSION"
          sudo apt-get update
          sudo apt-get install -y bubblewrap dbus-user-session clangd
          pip install -r requirements-dev.txt python-lsp-server==1.14.0 pexpect==4.9.0 memray==1.19.1
          npm install --global @ast-grep/cli@0.51.3 typescript-language-server@5.1.3 typescript@5.9.3
          sudo loginctl enable-linger "$USER"
          echo "$bin" >> "$GITHUB_PATH"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
      - name: Run native harness with scripted transport
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: |
          set -euo pipefail
          if ! systemd-run --user --wait --collect /usr/bin/true ||
             ! bwrap --unshare-all --ro-bind / / /usr/bin/true; then
            echo "UNSUPPORTED — required Linux isolation unavailable" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "$SCENARIO" = autoresearch_smoke ] || [ "$SCENARIO" = engineering_evolution ]; then
            export DL_TEST_TRACE_ISOLATION=1
            nested_isolation() {
              bwrap --unshare-pid --unshare-ipc --unshare-uts --ro-bind / / \
                --proc /proc --dev /dev -- \
                bwrap --unshare-all --cap-drop ALL --ro-bind / / --proc /proc --dev /dev -- /usr/bin/true
            }
            if ! nested_isolation; then
              echo "UNSUPPORTED — nested Linux isolation unavailable" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          fi
          run_test() {
            if python "tests/omp_$SCENARIO.py" "$@"; then
              echo "PASSED — $SCENARIO $*" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "FAILED — $SCENARIO $*" >> "$GITHUB_STEP_SUMMARY"
              return 1
            fi
          }
          if [ "$SCENARIO" = engineering_smoke ]; then
            command -v pylsp clangd ruff ast-grep memray
            export DL_TEST_TUI=1
          fi
          if [ "$SCENARIO" = lsp_matrix ]; then
            export DL_REQUIRE_LSP_MATRIX=1
            echo "NOT VERIFIED — Rust, Go, Java and Kotlin language servers" >> "$GITHUB_STEP_SUMMARY"
          fi
          run_test
          if [ "$SCENARIO" = autoresearch_smoke ]; then run_test --contracts; fi

  fedora-core:
    runs-on: ubuntu-24.04
    container: fedora:44
    steps:
      - run: dnf -y install git python3 python3-pip gcc make groff tar gzip diffutils
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: |
          python3 -m venv /tmp/deadlion-ci
          . /tmp/deadlion-ci/bin/activate
          pip install -r requirements-dev.txt
          pytest -q -rs tests/test_dl_budget.py tests/test_dl_contrast.py tests/test_dl_guard.py \
            tests/test_dl_new.py tests/test_dl_size.py tests/test_engineering_core.py tests/test_plugin_layout.py
